name: Deploy portfolio demo

on:
  push:
    branches: [portfolio-demo-mode]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEMO_SSH_HOST }}
          username: ${{ secrets.DEMO_SSH_USER }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/fin-portfolio-demo
            cd ~/fin-portfolio-demo

            if [ ! -d fin-backend ]; then
              git clone -b portfolio-demo-mode https://github.com/AppFin/fin-backend.git fin-backend
            fi
            if [ ! -d fin-frontend ]; then
              git clone -b portfolio-demo-mode https://github.com/AppFin/fin-frontend.git fin-frontend
            fi

            cd fin-backend
            git fetch origin portfolio-demo-mode
            git reset --hard origin/portfolio-demo-mode
            cd ..

            cd fin-frontend
            git fetch origin portfolio-demo-mode
            git reset --hard origin/portfolio-demo-mode
            cd ..

            # .env lives only on the server (never in git) and holds the
            # secrets/config from README-DEPLOY.md - both builds/services read it.
            if [ ! -f fin-backend/.env ]; then
              echo "Missing ~/fin-portfolio-demo/fin-backend/.env - see fin-backend/README-DEPLOY.md" >&2
              exit 1
            fi
            set -a
            source fin-backend/.env
            set +a

            # Built one at a time, with a memory cap each, so the build
            # doesn't fight the running containers for RAM on a small VM.
            docker build --memory=6g --memory-swap=4g -t fin-api:latest -f fin-backend/Dockerfile fin-backend
            docker build --memory=6g --memory-swap=4g \
              --build-arg API_URL="${PUBLIC_API_URL:-https://localhost:7122/v1}" \
              -t fin-front:latest fin-frontend

            cd fin-backend
            docker compose -f docker-compose.prod.yml up -d
            cd ..

            docker image prune -f
