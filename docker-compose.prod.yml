services:
  postgres:
    image: postgres:16
    container_name: fin-postgres
    restart: always
    environment:
      POSTGRES_DB: fin_app
      POSTGRES_USER: fin_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fin_app"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: fin-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  api:
    image: fin-api:latest
    container_name: fin-api
    restart: always
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=fin_app;Username=fin_app;Password=${POSTGRES_PASSWORD}
      ApiSettings__Redis: redis:6379
    depends_on:
      - postgres
      - redis
    # Published on the VM's private IP so the NPM instance on the other
    # (AMD) VM can reach it over the Oracle private network - Docker
    # networks don't span hosts, so a same-host "web" network is no use here.
    ports:
      - "${FIN_API_PORT:-8091}:8080"
    networks:
      - internal

  front:
    image: fin-front:latest
    container_name: fin-front
    restart: always
    depends_on:
      - api
    ports:
      - "${FIN_FRONT_PORT:-8090}:80"
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
